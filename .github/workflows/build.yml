name: build

# Builds each newly published release, as a check that the tagged source builds on a clean
# machine, and to the same bytes as the binaries published: the release itself comes from `just
# release`, which builds and signs it offline, so the key never touches GitHub. A difference means
# the build isn't reproducible, or what was published isn't what the tag builds.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: chat-linux-x86_64
            dir: build-static
            bin: chat
            cmake_args: -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/zig-linux-musl.cmake
          - asset: chat-windows-x86_64.exe
            dir: build-win
            bin: chat.exe
            cmake_args: -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/zig-windows.cmake
    runs-on: ubuntu-24.04
    steps:
      # With the tags, so the build stamp names the release as `just dist` does (git describe).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up zig
        env:
          ZIG_VERSION: 0.16.0
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          name=zig-x86_64-linux-$ZIG_VERSION
          curl -fsSL -o "$RUNNER_TEMP/$name.tar.xz" "https://ziglang.org/download/$ZIG_VERSION/$name.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/$name.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/$name/zig" version

      - name: Read version
        id: version
        run: |
          v=$(sed -n 's/^project(chat VERSION \([0-9.]*\).*/\1/p; s/^set(CHAT_PRERELEASE "\(.*\)")$/\1/p' CMakeLists.txt | tr -d '\n')
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # The commit's time, not the build's, as `just dist` stamps it.
      - name: Stamp with the commit's time
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -B ${{ matrix.dir }} ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build ${{ matrix.dir }} -j "$(nproc)"

      - name: Rename binary
        run: |
          mkdir dist
          cp ${{ matrix.dir }}/${{ matrix.bin }} dist/${{ matrix.asset }}
          if [ "${{ matrix.dir }}" = build-static ]; then strip dist/${{ matrix.asset }}; fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}-${{ steps.version.outputs.version }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

      # The published binary ends with the signed list of the release's builds, which this one
      # doesn't have: its length in 8 digits and CHATBLD1 come last (`just _core-hash`).
      - name: Compare with the published binary
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          curl -fsSL -o published "https://github.com/${{ github.repository }}/releases/download/$TAG/${{ matrix.asset }}"
          size=$(wc -c < published)
          if [ "$(tail -c 8 published)" = CHATBLD1 ]; then
            len=$(tail -c 16 published | head -c 8 | sed 's/^0*//')
            size=$((size - 16 - ${len:-0}))
          fi
          theirs=$(head -c "$size" published | sha256sum | cut -c1-64)
          mine=$(sha256sum < dist/${{ matrix.asset }} | cut -c1-64)
          echo "built here: $mine"
          echo "published:  $theirs"
          test "$mine" = "$theirs" || { echo "::error::${{ matrix.asset }} built from $TAG isn't the one published"; exit 1; }

