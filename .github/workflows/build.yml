name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: chat-linux-x86_64
            dir: build-static
            bin: chat
            cmake_args: -DCMAKE_TOOLCHAIN_FILE=cmake/zig-linux-musl.cmake
          - asset: chat-windows-x86_64.exe
            dir: build-win
            bin: chat.exe
            cmake_args: -DCMAKE_TOOLCHAIN_FILE=cmake/zig-windows.cmake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up zig
        env:
          ZIG_VERSION: 0.16.0
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          name=zig-x86_64-linux-$ZIG_VERSION
          curl -fsSL -o "$RUNNER_TEMP/$name.tar.xz" "https://ziglang.org/download/$ZIG_VERSION/$name.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/$name.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/$name/zig" version

      - name: Read version
        id: version
        run: |
          v=$(sed -n 's/^project(chat VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -B ${{ matrix.dir }} ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build ${{ matrix.dir }} -j "$(nproc)"

      - name: Rename binary
        run: |
          mkdir dist
          cp ${{ matrix.dir }}/${{ matrix.bin }} dist/${{ matrix.asset }}
          if [ "${{ matrix.dir }}" = build-static ]; then strip dist/${{ matrix.asset }}; fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}-${{ steps.version.outputs.version }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches CMakeLists.txt version
        id: version
        run: |
          v=$(sed -n 's/^project(chat VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match project version $v in CMakeLists.txt"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum chat-linux-x86_64 chat-windows-x86_64.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 == "## " v { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${{ steps.version.outputs.version }}"
            exit 1
          fi
          {
            echo 'Verify a manual download with `sha256sum -c --ignore-missing SHA256SUMS`.'
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            dist/chat-linux-x86_64 dist/chat-windows-x86_64.exe dist/SHA256SUMS
