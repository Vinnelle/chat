name: test

# Runs the engine test on every push and pull request, as built and again under the sanitizers, and
# each fuzz target for a minute, so a change that breaks a session or trips a sanitizer shows before
# a release is cut.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -B build-test -DCHAT_TESTS=ON

      - name: Build
        run: cmake --build build-test -j "$(nproc)" --target engine_test chat

      - name: Engine test
        run: ./build-test/tests/engine_test

  engine-sanitized:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the sanitizers' runtime
        run: sudo apt-get update -q && sudo apt-get install -y -q clang-18 libclang-rt-18-dev

      - name: Configure
        run: cmake -B build-asan -DCHAT_TESTS=ON -DCHAT_SANITIZE=ON -DCMAKE_C_COMPILER=clang-18 -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-asan -j "$(nproc)" --target engine_test

      - name: Engine test under AddressSanitizer and UndefinedBehaviorSanitizer
        run: ./build-asan/tests/engine_test

  # Cross-built with zig, as releases are, then run on Windows itself.
  windows-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up zig
        env:
          ZIG_VERSION: 0.16.0
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          name=zig-x86_64-linux-$ZIG_VERSION
          curl -fsSL -o "$RUNNER_TEMP/$name.tar.xz" "https://ziglang.org/download/$ZIG_VERSION/$name.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/$name.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake -B build-win-test -DCMAKE_TOOLCHAIN_FILE=cmake/zig-windows.cmake -DCHAT_TESTS=ON

      - name: Build
        run: cmake --build build-win-test -j "$(nproc)" --target engine_test chat

      - uses: actions/upload-artifact@v7
        with:
          name: windows-test-builds
          path: |
            build-win-test/tests/engine_test.exe
            build-win-test/chat.exe
          if-no-files-found: error

  windows:
    needs: windows-build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-test-builds
          path: win

      - name: Engine test
        run: win/tests/engine_test.exe

      # Its hardening runs first thing, before anything else it does.
      - name: chat starts, opens a session and quits
        run: |
          win/chat.exe --version
          printf ':quit\n' | win/chat.exe --simple --routing dht --nodht --nonostr --noportmap --nolan

  # The same for macOS on Apple silicon, which zig cross-builds without Apple's SDK.
  macos-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up zig
        env:
          ZIG_VERSION: 0.16.0
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          name=zig-x86_64-linux-$ZIG_VERSION
          curl -fsSL -o "$RUNNER_TEMP/$name.tar.xz" "https://ziglang.org/download/$ZIG_VERSION/$name.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/$name.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake -B build-macos -DCMAKE_TOOLCHAIN_FILE=cmake/zig-macos-aarch64.cmake -DCHAT_TESTS=ON

      - name: Build
        run: cmake --build build-macos -j "$(nproc)" --target engine_test chat

      - uses: actions/upload-artifact@v7
        with:
          name: macos-test-builds
          path: |
            build-macos/tests/engine_test
            build-macos/chat
          if-no-files-found: error

  macos:
    needs: macos-build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macos-test-builds
          path: mac

      # Artifacts don't keep the executable bit.
      - name: Engine test
        run: |
          chmod +x mac/tests/engine_test mac/chat
          mac/tests/engine_test

      - name: chat starts, opens a session and quits
        run: |
          mac/chat --version
          printf ':quit\n' | mac/chat --simple --routing dht --nodht --nonostr --noportmap --nolan

  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [bencode, json, pgp, text, engine, image, toml, save, ctap2, tpm2]
    steps:
      - uses: actions/checkout@v7

      - name: Install libFuzzer's runtime
        run: sudo apt-get update -q && sudo apt-get install -y -q clang-18 libclang-rt-18-dev

      - name: Configure
        run: cmake -B build-fuzz -DCHAT_FUZZ=ON -DCMAKE_C_COMPILER=clang-18 -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-fuzz -j "$(nproc)" --target fuzz_${{ matrix.target }}

      # Each run starts from the corpus the last one left, so a minute adds to what earlier runs
      # found instead of starting again from the seeds.
      - name: Restore the corpus
        uses: actions/cache@v6
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz for a minute
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          mkdir -p corpus crashes
          seeds=""
          if [ -d tests/seeds/${{ matrix.target }} ]; then seeds=tests/seeds/${{ matrix.target }}; fi
          ./build-fuzz/tests/fuzz_${{ matrix.target }} corpus $seeds -dict=tests/fuzz.dict \
            -max_total_time=60 -artifact_prefix=crashes/

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}-crash
          path: crashes/
          if-no-files-found: ignore
